services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: socot
      POSTGRES_USER: socot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - socot-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socot -d socot"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  socot-postgres:
